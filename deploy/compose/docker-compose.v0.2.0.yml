# Christmas List Organiser: v0.2.0
# Generated by scripts/generate_compose.py on release. Do not edit by hand:
# change deploy/compose.template.yml instead.
#
# Every service pulls a pre-built image; nothing is built on the host.
# Usage:
#   cp .env.example .env    # then set POSTGRES_PASSWORD and ADMIN_PASSWORD
#   docker compose -f docker-compose.v0.2.0.yml up -d
name: christmas-list-organiser

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-xmas}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-xmas}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
      TZ: ${TZ:-Europe/London}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/ashleycollinge1/christmas-list-organiser:0.2.0@sha256:7f9e53a0ff75b39e4637f48f2b00e08b9138f3ffd11d6e14393857f2a1c1f002
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # web runs database migrations on start, so it waits for the backup
      # service's start-up dump to succeed first.
      backup:
        condition: service_healthy
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      TZ: ${TZ:-Europe/London}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # pg_dump into BACKUP_PATH on the host: once every time it starts (which is
  # before web, so before any migration) and then nightly. Uses the same image
  # as the database, so pg_dump always matches the server version.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-xmas}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-xmas}
      TZ: ${TZ:-Europe/London}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_UID: ${BACKUP_UID:-1000}
      BACKUP_GID: ${BACKUP_GID:-1000}
      # "false" lets web start even if the start-up dump fails (not recommended).
      BACKUP_REQUIRED: ${BACKUP_REQUIRED:-true}
      # Changes with every release, so upgrading always recreates this service
      # and takes a fresh dump before the new web version migrates the database.
      BACKUP_FOR_VERSION: v0.2.0
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        backup() {
          f="/backups/christmas-$$(date +%Y-%m-%d_%H%M%S)$${1:+_$$1}.dump"
          ok=0
          if pg_dump --format=custom --file="$$f.partial"; then
            mv "$$f.partial" "$$f"
            chown "$$BACKUP_UID:$$BACKUP_GID" "$$f" || true
            echo "backup: wrote $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.partial"
            echo "backup: FAILED" >&2
            ok=1
          fi
          find /backups -maxdepth 1 -name 'christmas-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -print -delete | sed 's/^/backup: pruned /'
          return $$ok
        }
        trap 'exit 0' TERM INT
        rm -f /tmp/ready
        echo "backup: start-up dump ($$BACKUP_FOR_VERSION), then daily at $$BACKUP_TIME ($$TZ), keeping $$BACKUP_KEEP_DAYS days"
        if backup startup; then
          touch /tmp/ready
        elif [ "$$BACKUP_REQUIRED" = "false" ]; then
          echo "backup: start-up dump failed; BACKUP_REQUIRED=false, so web may start anyway" >&2
          touch /tmp/ready
        else
          echo "backup: start-up dump failed, so web will NOT start (it would migrate without a backup). Fix the error above, or set BACKUP_REQUIRED=false." >&2
          sleep 30
          exit 1
        fi
        while :; do
          now=$$(date +%s)
          next=$$(date -d "$$BACKUP_TIME" +%s)
          [ "$$next" -gt "$$now" ] || next=$$((next + 86400))
          sleep $$((next - now)) & wait $$!
          backup nightly || echo "backup: will retry tomorrow" >&2
        done
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10m
    stop_grace_period: 5s

volumes:
  pgdata:
