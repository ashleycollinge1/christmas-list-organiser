# Christmas List Organiser: v0.3.0
# Generated by scripts/generate_compose.py on release. Do not edit by hand:
# change deploy/compose.template.yml instead.
#
# Every service pulls a pre-built image; nothing is built on the host.
# Usage:
#   cp .env.example .env    # then set POSTGRES_PASSWORD and ADMIN_PASSWORD
#   docker compose -f docker-compose.v0.3.0.yml up -d
name: christmas-list-organiser

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-xmas}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-xmas}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
      TZ: ${TZ:-Europe/London}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/ashleycollinge1/christmas-list-organiser:0.3.0@sha256:d2e047b2b31c5fcbc6c991e108540c561d9933effa06e4aee520cbc247388e2b
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # web runs database migrations on start, so it waits for the backup
      # service's start-up dump to succeed first.
      backup:
        condition: service_healthy
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      TZ: ${TZ:-Europe/London}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # pg_dump into BACKUP_PATH on the host: once every time it starts (which is
  # before web, so before any migration) and then nightly. Uses the same image
  # as the database, so pg_dump always matches the server version.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-xmas}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-xmas}
      TZ: ${TZ:-Europe/London}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_UID: ${BACKUP_UID:-1000}
      BACKUP_GID: ${BACKUP_GID:-1000}
      # "false" lets web start even if the start-up dump fails (not recommended).
      BACKUP_REQUIRED: ${BACKUP_REQUIRED:-true}
      # Changes with every release, so upgrading always recreates this service
      # and takes a fresh dump before the new web version migrates the database.
      BACKUP_FOR_VERSION: v0.3.0
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        backup() {
          f="/backups/christmas-$$(date +%Y-%m-%d_%H%M%S)$${1:+_$$1}.dump"
          ok=0
          if pg_dump --format=custom --file="$$f.partial"; then
            mv "$$f.partial" "$$f"
            chown "$$BACKUP_UID:$$BACKUP_GID" "$$f" || true
            echo "backup: wrote $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.partial"
            echo "backup: FAILED" >&2
            ok=1
          fi
          # The one-off "before-vX.Y.Z" dumps are kept: they're what a rollback restores.
          find /backups -maxdepth 1 -name 'christmas-*.dump' ! -name '*_before-v*' -mtime +"$$BACKUP_KEEP_DAYS" -print -delete | sed 's/^/backup: pruned /'
          return $$ok
        }
        # restore-backup FILE: replace the whole database with a dump, atomically.
        # Saves a safety copy first; on any error nothing changes.
        cat > /usr/local/bin/restore-backup <<'RESTORE'
        #!/bin/sh
        set -eu
        [ $$# -eq 1 ] || { echo "usage: restore-backup <file in the backups folder>"; ls -1 /backups; exit 2; }
        case "$$1" in /*) f="$$1" ;; *) f="/backups/$$1" ;; esac
        [ -f "$$f" ] || { echo "No such backup: $$f"; ls -1 /backups; exit 1; }
        pg_restore --list "$$f" >/dev/null || { echo "$$f is not a readable backup."; exit 1; }
        safety="/backups/christmas-$$(date +%Y-%m-%d_%H%M%S)_before-restore.dump"
        pg_dump --format=custom --file="$$safety"
        echo "Safety copy of the current data: $$safety"
        psql -qAt -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid()" >/dev/null
        { echo "SET client_min_messages = warning; DROP SCHEMA public CASCADE; CREATE SCHEMA public;"; pg_restore --no-owner --file=- "$$f"; } \
          | psql -q -v ON_ERROR_STOP=1 --single-transaction >/dev/null
        echo "Restored $$f."
        echo "Now start the version that made it, e.g.: docker compose up -d"
        RESTORE
        chmod 0755 /usr/local/bin/restore-backup
        trap 'exit 0' TERM INT
        rm -f /tmp/ready
        # The first start of a new version keeps a named copy: christmas-<date>_before-vX.Y.Z.dump.
        label=startup
        ls /backups/christmas-*_before-"$$BACKUP_FOR_VERSION".dump >/dev/null 2>&1 || label="before-$$BACKUP_FOR_VERSION"
        echo "backup: start-up dump ($$label), then daily at $$BACKUP_TIME ($$TZ), keeping $$BACKUP_KEEP_DAYS days"
        if backup "$$label"; then
          touch /tmp/ready
        elif [ "$$BACKUP_REQUIRED" = "false" ]; then
          echo "backup: start-up dump failed; BACKUP_REQUIRED=false, so web may start anyway" >&2
          touch /tmp/ready
        else
          echo "backup: start-up dump failed, so web will NOT start (it would migrate without a backup). Fix the error above, or set BACKUP_REQUIRED=false." >&2
          sleep 30
          exit 1
        fi
        while :; do
          now=$$(date +%s)
          next=$$(date -d "$$BACKUP_TIME" +%s)
          [ "$$next" -gt "$$now" ] || next=$$((next + 86400))
          sleep $$((next - now)) & wait $$!
          backup nightly || echo "backup: will retry tomorrow" >&2
        done
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10m
    stop_grace_period: 5s

volumes:
  pgdata:
