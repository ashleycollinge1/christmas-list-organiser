name: CI

on:
  push:
    branches: [stable]
    paths-ignore:
      - "deploy/compose/**"
      - "docker-compose.yml"
      - "**.md"
  pull_request:
  workflow_call:
    inputs:
      skip_docker:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xmas
          POSTGRES_PASSWORD: xmas
          POSTGRES_DB: xmas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xmas"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://xmas:xmas@localhost:5432/xmas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Models match migrations
        # Fails if a model change has no migration (or a migration doesn't match the models).
        run: |
          alembic upgrade head
          alembic check

  docker-build:
    # Verifies the image builds on every PR/push; release.yml does the publishing.
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
