<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4eee3">
  <meta name="format-detection" content="telephone=no">
  <title>Christmas List</title>
  <link rel="preload" href="/static/fonts/Fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/IBMPlexSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/" aria-label="Christmas List: overview">
      <span class="brand-star" aria-hidden="true"></span>
      <span class="brand-word">Christmas <em>List</em></span>
    </a>
    <span class="season-tag" id="season-tag"></span>
  </header>
  <main id="main" tabindex="-1">
    <section class="page boot" aria-label="Loading">
      <span class="skeleton skeleton-line w-40"></span>
      <span class="skeleton skeleton-block"></span>
      <span class="skeleton skeleton-line w-70"></span>
    </section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Primary" hidden>
    <ul id="nav-links"></ul>
  </nav>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Christmas List needs JavaScript enabled.</p></noscript>
</body>
</html>
